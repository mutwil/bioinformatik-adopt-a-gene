<!-- interactive network bridge: webR R cells emit a @@CYNET@@{json}@@END@@ marker via cat();
     this script catches it in the DOM, strips the raw marker, and renders an interactive
     cytoscape.js graph (drag / zoom / pan) right below the cell output.
     Features: LAYER toggles (co-expression / PPI / regulation); a COLOUR-BY-METRIC panel
     (degree / betweenness / clustering / components) recomputed in-browser on the switched-on
     layers (same algorithms as the base-R helpers, so numbers match); a FULL-SCREEN button; and
     hover TOOLTIPS (gene description on nodes, relationship description on edges). -->
<script src="cytoscape.min.js"></script>
<style>
  /* full-screen (viewport-fill) mode for a network */
  .cynet-wrap.cynet-max{ position:fixed; inset:0; z-index:9999; background:#fff; box-sizing:border-box;
    padding:10px; margin:0 !important; display:flex; flex-direction:column; }
  .cynet-wrap.cynet-max > .cynet-graph{ flex:1 1 auto !important; height:auto !important; }
  @media (prefers-color-scheme: dark){ .cynet-wrap.cynet-max{ background:#0f141a; } }
  #cynet-tip{ position:fixed; z-index:10001; max-width:340px; pointer-events:none; display:none;
    background:rgba(20,22,26,.96); color:#fff; font:12px/1.45 system-ui,sans-serif; padding:7px 10px;
    border-radius:7px; box-shadow:0 3px 14px rgba(0,0,0,.35); }
  #cynet-tip .agi{ opacity:.62; font-weight:400; }
</style>
<script>
(function () {
  var RE = /@@CYNET@@([\s\S]*?)@@END@@/;

  var LAYOUTS = {
    Spread:     { name:"cose", animate:false, randomize:true, padding:24, nodeOverlap:28, nodeRepulsion:20000,
                  idealEdgeLength:95, edgeElasticity:120, componentSpacing:140, gravity:0.15, numIter:1500 },
    Circle:     { name:"circle", padding:24 },
    Concentric: { name:"concentric", padding:24, minNodeSpacing:16,
                  concentric:function (n) { return n.degree(); }, levelWidth:function () { return 2; } },
    Grid:       { name:"grid", padding:24, avoidOverlap:true },
    Hierarchy:  { name:"breadthfirst", directed:true, padding:24, spacingFactor:1.2 }
  };

  // ---- edge-layer helpers ------------------------------------------------
  function LAYER_OF(kind) {
    if (!kind) return "coexp";
    if (kind.indexOf("GRN") === 0) return "grn";
    if (kind === "PPI") return "ppi";
    return "coexp";
  }
  var LAYER_META = {
    coexp: { label:"Co-expression", color:"#8a8a8a" },
    ppi:   { label:"PPI",           color:"#2c7fb8" },
    grn:   { label:"Regulation",    color:"#2e8b2e" }
  };
  var MNAME = { degree:"Degree", betweenness:"Betweenness", clustering:"Clustering", components:"Components" };
  function EDGE_LABEL(kind) {
    if (kind === "PPI") return "physical interaction (BioGRID)";
    if (kind === "GRN_activates") return "activates (regulatory)";
    if (kind === "GRN_represses") return "represses (regulatory)";
    if (kind && kind.indexOf("GRN") === 0) return "regulates (regulatory)";
    return "co-expression (correlated profiles)";
  }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // ---- hover tooltip (shared, appended to body) --------------------------
  var TIP = null;
  function tip() { if (!TIP) { TIP = document.createElement("div"); TIP.id = "cynet-tip"; document.body.appendChild(TIP); } return TIP; }
  function showTip(html, e) { var t = tip(); t.innerHTML = html; t.style.display = "block"; moveTip(e); }
  function moveTip(e) {
    if (!TIP || TIP.style.display !== "block") return;
    var oe = (e && e.originalEvent) || e; if (!oe || oe.clientX == null) return;
    var w = TIP.offsetWidth, h = TIP.offsetHeight, nx = oe.clientX + 14, ny = oe.clientY + 14;
    if (nx + w > window.innerWidth)  nx = oe.clientX - w - 14;
    if (ny + h > window.innerHeight) ny = oe.clientY - h - 14;
    TIP.style.left = Math.max(4, nx) + "px"; TIP.style.top = Math.max(4, ny) + "px";
  }
  function hideTip() { if (TIP) TIP.style.display = "none"; }

  // ---- full-screen (viewport-fill) ---------------------------------------
  function resizeSoon(cy) { setTimeout(function () { try { cy.resize(); cy.fit(undefined, 20); } catch (e) {} }, 120); }
  function toggleFull(wrap, cy) { wrap.classList.toggle("cynet-max"); hideTip(); resizeSoon(cy); }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") document.querySelectorAll(".cynet-wrap.cynet-max").forEach(function (w) {
      w.classList.remove("cynet-max"); if (w._cy) resizeSoon(w._cy);
    });
  });

  // ---- graph metrics (match the base-R helpers: undirected, Brandes/2) ---
  function adjFrom(cy, on) {
    var adj = {};                                   // node set = every node touched by a switched-on edge = the current view
    cy.edges().forEach(function (e) {
      if (!on[LAYER_OF(e.data("kind"))]) return;
      var s = e.data("source"), t = e.data("target");
      if (s === t) return;
      if (!adj[s]) adj[s] = new Set();
      if (!adj[t]) adj[t] = new Set();
      adj[s].add(t); adj[t].add(s);
    });
    return { adj: adj, ids: Object.keys(adj) };
  }
  function betweennessJS(ids, adjSet) {
    var adj = {}; ids.forEach(function (n) { adj[n] = Array.from(adjSet[n]); });
    var CB = {}; ids.forEach(function (n) { CB[n] = 0; });
    ids.forEach(function (s) {
      var S = [], P = {}, sigma = {}, d = {}, Q = [];
      ids.forEach(function (w) { P[w] = []; sigma[w] = 0; d[w] = -1; });
      sigma[s] = 1; d[s] = 0; Q.push(s);
      while (Q.length) {
        var v = Q.shift(); S.push(v); var nb = adj[v];
        for (var i = 0; i < nb.length; i++) { var w = nb[i];
          if (d[w] < 0) { d[w] = d[v] + 1; Q.push(w); }
          if (d[w] === d[v] + 1) { sigma[w] += sigma[v]; P[w].push(v); } }
      }
      var delta = {}; ids.forEach(function (w) { delta[w] = 0; });
      for (var j = S.length - 1; j >= 0; j--) { var w = S[j], pp = P[w];
        for (var k = 0; k < pp.length; k++) { var u = pp[k]; delta[u] += (sigma[u] / sigma[w]) * (1 + delta[w]); }
        if (w !== s) CB[w] += delta[w]; }
    });
    ids.forEach(function (n) { CB[n] /= 2; });
    return CB;
  }
  function clusteringJS(ids, adjSet) {
    var cc = {};
    ids.forEach(function (n) {
      var nb = Array.from(adjSet[n]), k = nb.length;
      if (k < 2) { cc[n] = 0; return; }
      var links = 0;
      for (var i = 0; i < k; i++) for (var j = i + 1; j < k; j++) if (adjSet[nb[i]].has(nb[j])) links++;
      cc[n] = links / (k * (k - 1) / 2);
    });
    return cc;
  }
  function componentsJS(ids, adjSet) {
    var comp = {}, k = 0;
    ids.forEach(function (s) {
      if (comp[s] !== undefined) return;
      k++; var Q = [s]; comp[s] = k;
      while (Q.length) { var u = Q.shift();
        adjSet[u].forEach(function (w) { if (comp[w] === undefined) { comp[w] = k; Q.push(w); } }); }
    });
    return { comp: comp, k: k };
  }

  var HEAT = [[247,247,247],[253,174,107],[230,85,13],[165,15,21]];
  function heatJS(t) {
    t = Math.max(0, Math.min(1, t)); var seg = HEAT.length - 1;
    var x = t * seg, i = Math.min(Math.floor(x), seg - 1), f = x - i, a = HEAT[i], b = HEAT[i + 1];
    return "rgb(" + Math.round(a[0]+(b[0]-a[0])*f) + "," + Math.round(a[1]+(b[1]-a[1])*f) + "," + Math.round(a[2]+(b[2]-a[2])*f) + ")";
  }
  var CPAL = ["#4e79a7","#f28e2b","#59a14f","#e15759","#b07aa1","#76b7b2","#edc948","#ff9da7","#9c755f","#bab0ac"];

  function applyMetric(cy, on, metric, legend) {
    if (metric === "plain") { cy.nodes().forEach(function (n) { n.removeStyle("background-color width height"); }); legend.innerHTML = ""; return; }
    var g = adjFrom(cy, on), ids = g.ids, adjSet = g.adj, val = {}, isComp = false, compK = 0;
    if (!ids.length) { legend.innerHTML = ""; return; }
    if (metric === "degree") { ids.forEach(function (n) { val[n] = adjSet[n].size; }); }
    else if (metric === "components") { var r = componentsJS(ids, adjSet); val = r.comp; compK = r.k; isComp = true; }
    else if (metric === "betweenness") { val = betweennessJS(ids, adjSet); }
    else if (metric === "clustering") { val = clusteringJS(ids, adjSet); }

    if (isComp) {
      ids.forEach(function (id) { var n = cy.getElementById(id);
        n.style("background-color", CPAL[(val[id] - 1) % CPAL.length]); n.style("width", 28); n.style("height", 28); });
      legend.innerHTML = "<b>Components</b>: " + compK + " disconnected part" + (compK === 1 ? "" : "s") + " in the current view.";
      return;
    }
    var arr = ids.map(function (id) { return val[id]; });
    var mn = Math.min.apply(null, arr), mx = Math.max.apply(null, arr), top = ids[0];
    ids.forEach(function (id) { if (val[id] > val[top]) top = id; });
    ids.forEach(function (id) {                       // colour ONLY the nodes in the current view (no NaN on hidden ones)
      var t = (mx > mn) ? (val[id] - mn) / (mx - mn) : 0.5, n = cy.getElementById(id);
      n.style("background-color", heatJS(t)); n.style("width", 20 + 30 * t); n.style("height", 20 + 30 * t);
    });
    var fmt = function (x) { return metric === "clustering" ? x.toFixed(2) : Math.round(x * 10) / 10; };
    legend.innerHTML = "<b>" + MNAME[metric] + "</b>: " + fmt(mn) + " (light/small) → " + fmt(mx) +
                       " (dark/large) · top: <b>" + esc(cy.getElementById(top).data("label")) + "</b> (" + fmt(val[top]) + ")";
  }

  // ---- controls ----------------------------------------------------------
  function addRow(cap) { var d = document.createElement("div"); d.style.cssText = "padding:2px 2px;"; cap.appendChild(d); return d; }
  function mkbtn(row, label, fn) {
    var b = document.createElement("button"); b.textContent = label;
    b.style.cssText = "margin-left:5px;margin-top:3px;font:600 11px system-ui;color:#1a202c;border:1px solid #cbd5e0;border-radius:5px;background:#fff;cursor:pointer;padding:2px 8px;";
    if (fn) { b.onmouseover = function () { b.style.filter = "brightness(.96)"; }; b.onmouseout = function () { b.style.filter = ""; }; b.onclick = fn; }
    row.appendChild(b); return b;
  }

  function buildControls(cap, cy, data, wrap) {
    cap.innerHTML = "";
    var kinds = {}; cy.edges().forEach(function (e) { kinds[LAYER_OF(e.data("kind"))] = true; });
    var present = ["coexp","ppi","grn"].filter(function (l) { return kinds[l]; });
    var on = { coexp:true, ppi:true, grn:true };
    var metric = (data && data.metric) ? data.metric : "plain";

    var row0 = addRow(cap), row2 = addRow(cap), legend = addRow(cap);
    legend.style.cssText = "font-size:11px;color:#444;padding:2px 2px;min-height:14px;";

    var lastLayout = LAYOUTS.Spread;
    function relayout() {                       // lay out ONLY the visible (connected) nodes
      var vis = cy.elements(":visible"); if (!vis.length) return;
      var lay = vis.layout(lastLayout); lay.one("layoutstop", function () { cy.fit(undefined, 20); }); lay.run();
    }
    var t = document.createElement("span");
    t.textContent = "🕸 " + (cap.dataset.title || "network") + "  —  drag · scroll-zoom · hover for info · layout:";
    row0.appendChild(t);
    Object.keys(LAYOUTS).forEach(function (name) { mkbtn(row0, name, function () { lastLayout = LAYOUTS[name]; relayout(); }); });
    mkbtn(row0, "⤢ fit", function () { cy.fit(undefined, 20); });
    mkbtn(row0, "⛶ Full screen", function () { toggleFull(wrap, cy); });
    mkbtn(row0, "📷 PNG", function () {
      var a = document.createElement("a");
      a.href = cy.png({ full: true, scale: 2, bg: "#fff" });
      a.download = (cap.dataset.title || "network").replace(/[^\w-]+/g, "_") + ".png"; a.click();
    });

    function recolor() { applyMetric(cy, on, metric, legend); }
    function hideIsolated() {                   // hide nodes with no edge in the switched-on layers
      var deg = {}; cy.nodes().forEach(function (n) { deg[n.id()] = 0; });
      cy.edges().forEach(function (e) {
        if (!on[LAYER_OF(e.data("kind"))]) return;
        var s = e.data("source"), tg = e.data("target"); if (s === tg) return;
        if (deg[s] != null) deg[s]++; if (deg[tg] != null) deg[tg]++;
      });
      cy.nodes().forEach(function (n) { n.style("display", deg[n.id()] > 0 ? "element" : "none"); });
    }
    function applyVisibility() {
      cy.edges().forEach(function (e) { e.style("display", on[LAYER_OF(e.data("kind"))] ? "element" : "none"); });
      hideIsolated();                           // drop disconnected nodes so layouts only place connected ones
      recolor();
    }

    if (present.length >= 2) {
      var row1 = document.createElement("div"); row1.style.cssText = "padding:2px 2px;"; cap.insertBefore(row1, row2);
      var l1 = document.createElement("span"); l1.textContent = "Layers: "; l1.style.fontWeight = "600"; row1.appendChild(l1);
      present.forEach(function (l) {
        var meta = LAYER_META[l];
        var cnt = cy.edges().filter(function (e) { return LAYER_OF(e.data("kind")) === l; }).length;
        var b = mkbtn(row1, meta.label + " (" + cnt + ")", null);
        function paint() { b.style.background = on[l] ? meta.color : "#fff"; b.style.color = on[l] ? "#fff" : "#555"; b.style.borderColor = meta.color; }
        b.onclick = function () { on[l] = !on[l]; paint(); applyVisibility(); relayout(); };
        paint();
      });
    }

    var l2 = document.createElement("span"); l2.textContent = "Colour nodes by: "; l2.style.fontWeight = "600"; row2.appendChild(l2);
    var mbtns = {};
    [["plain","Plain"],["degree","Degree"],["betweenness","Betweenness"],["clustering","Clustering"],["components","Components"]]
      .forEach(function (pair) {
        var key = pair[0], b = mkbtn(row2, pair[1], null); mbtns[key] = b;
        b.onclick = function () { metric = key; paintMetric(); recolor(); };
      });
    function paintMetric() {
      Object.keys(mbtns).forEach(function (k) {
        var a = (k === metric); mbtns[k].style.background = a ? "#2c5282" : "#fff";
        mbtns[k].style.color = a ? "#fff" : "#1a202c"; mbtns[k].style.borderColor = a ? "#2c5282" : "#cbd5e0";
      });
    }
    paintMetric();
    applyVisibility();
  }

  function render(div, data) {
    div.innerHTML = "";
    var els = [];
    data.nodes.forEach(function (n) {
      els.push({ data: { id: n.id, label: n.label, de: n.de || "", hub: !!n.hub, reg: !!n.reg,
                         col: n.col || "", sz: +n.sz || 0, bc: n.bc || "", bw: +n.bw || 0 } });
    });
    data.edges.forEach(function (e) {
      els.push({ data: { id: e.s + "__" + e.t + "__" + e.ty, source: e.s, target: e.t, kind: e.ty, de: e.d || "" } });
    });
    var cy = cytoscape({
      container: div,
      elements: els,
      wheelSensitivity: 0.25,
      style: [
        { selector: "node", style: {
            "label": "data(label)", "font-size": 10, "text-valign": "center", "color": "#111",
            "text-outline-width": 2, "text-outline-color": "#fff",
            "background-color": function (e) { return e.data("col") || (e.data("hub") ? "#f4c430" : (e.data("reg") ? "#e6973c" : "#9ecae1")); },
            "width":  function (e) { return e.data("sz") > 0 ? e.data("sz") : (e.data("hub") ? 42 : 26); },
            "height": function (e) { return e.data("sz") > 0 ? e.data("sz") : (e.data("hub") ? 42 : 26); },
            "border-width": function (e) { return e.data("bw") > 0 ? e.data("bw") : (e.data("hub") ? 3 : 1); },
            "border-color": function (e) { return e.data("bc") || "#555"; },
            "font-weight": function (e) { return e.data("hub") ? "bold" : "normal"; } } },
        { selector: "edge", style: { "width": 1.5, "line-color": "#cfcfcf", "curve-style": "bezier" } },
        { selector: 'edge[kind="PPI"]', style: { "line-color": "#2c7fb8", "width": 2.2 } },
        { selector: 'edge[kind ^= "GRN"]', style: {
            "target-arrow-shape": "triangle", "target-arrow-color": "#2e8b2e",
            "line-color": "#2e8b2e", "width": 2.6, "arrow-scale": 1.1 } },
        { selector: 'edge[kind="GRN_induces"]', style: { "line-style": "dashed" } },
        { selector: 'edge[kind="GRN_represses"]', style: {
            "line-color": "#c0392b", "target-arrow-color": "#c0392b", "target-arrow-shape": "tee", "width": 3 } },
        { selector: 'edge[kind="GRN_regulates"]', style: {
            "line-color": "#8a8a8a", "target-arrow-color": "#8a8a8a", "target-arrow-shape": "triangle", "width": 2 } }
      ],
      layout: LAYOUTS.Spread
    });
    cy.fit(undefined, 20);

    // hover tooltips: gene description on nodes, relationship description on edges
    cy.on("mouseover", "node", function (e) {
      var n = e.target, de = n.data("de");
      showTip("<b>" + esc(n.data("label")) + "</b> <span class='agi'>" + esc(n.id()) + "</span>" + "<br>" + esc(de || "Unknown function"), e);
    });
    cy.on("mouseover", "edge", function (e) {
      var ed = e.target, kind = ed.data("kind");
      var arrow = (kind && kind.indexOf("GRN") === 0) ? " → " : " — ";
      var rel = ed.data("de") || EDGE_LABEL(kind);
      showTip("<b>" + esc(ed.source().data("label")) + esc(arrow) + esc(ed.target().data("label")) + "</b><br>" + esc(rel), e);
    });
    cy.on("mouseout", "node", hideTip);
    cy.on("mouseout", "edge", hideTip);
    cy.on("mousemove", function (e) { moveTip(e); });
    cy.on("tapstart pan zoom drag", hideTip);
    return cy;
  }

  // Remove the @@CYNET@@…@@END@@ marker even when webR has split it across MANY text nodes.
  function stripMarker(root) {
    var nodes = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), t;
    while ((t = w.nextNode())) nodes.push(t);
    var full = "", i;
    for (i = 0; i < nodes.length; i++) full += nodes[i].nodeValue;
    var m = full.match(/@@CYNET@@[\s\S]*?@@END@@/);
    if (!m) return;
    var start = full.indexOf(m[0]), end = start + m[0].length, pos = 0;
    for (i = 0; i < nodes.length; i++) {
      var v = nodes[i].nodeValue, a = pos, b = pos + v.length;
      if (b > start && a < end) {
        var head = a < start ? v.slice(0, start - a) : "";
        var tail = b > end   ? v.slice(end - a)       : "";
        nodes[i].nodeValue = head + tail;
      }
      pos = b;
    }
  }

  function handle(node) {
    if (!node) return;
    var host = node.nodeType === 3 ? node.parentElement : node;
    if (!host || !host.textContent || host.textContent.indexOf("@@CYNET@@") === -1) return;
    var m = host.textContent.match(RE);
    if (!m) return;
    var data; try { data = JSON.parse(m[1]); } catch (e) { return; }

    var box = (host.closest && host.closest(".cell-output, .cell-output-display, .exercise-cell-output, pre")) || host;
    if (box.dataset && box.dataset.cynetId === data.id) return;
    if (box.dataset) box.dataset.cynetId = data.id;

    stripMarker(box);

    var wrapId = "cynetwrap-" + data.id;
    var wrap = document.getElementById(wrapId), div, cap;
    if (!wrap) {
      wrap = document.createElement("div"); wrap.id = wrapId; wrap.className = "cynet-wrap"; wrap.style.cssText = "margin:4px 0 14px;";
      cap = document.createElement("div"); cap.className = "cynet-cap"; cap.style.cssText = "font-size:12px;color:#555;padding:3px 2px;";
      div = document.createElement("div"); div.className = "cynet-graph";
      div.style.cssText = "width:100%;height:480px;border:1px solid #ddd;border-radius:8px;background:#fff;";
      wrap.appendChild(cap); wrap.appendChild(div);
    } else {
      cap = wrap.querySelector(".cynet-cap"); div = wrap.querySelector(".cynet-graph");
    }
    cap.dataset.title = data.title || "network";
    cap.textContent = "🕸 " + cap.dataset.title;
    box.parentNode.insertBefore(wrap, box.nextSibling);

    function mount() { var cy = render(div, data); wrap._cy = cy; buildControls(cap, cy, data, wrap); }
    if (window.cytoscape) { mount(); return; }
    var tries = 0, iv = setInterval(function () {
      if (window.cytoscape) { clearInterval(iv); mount(); }
      else if (++tries > 40) {
        clearInterval(iv);
        div.innerHTML = '<div style="padding:16px;color:#a00;font:13px system-ui">⚠ Could not load the network viewer (cytoscape.js). The R analysis above still ran — its results are in the text output. Try a page reload, or a network without a proxy/firewall.</div>';
      }
    }, 150);
  }

  function scanAll() { document.querySelectorAll("pre, .cell-output, .cell-output-display").forEach(handle); }

  function start() {
    new MutationObserver(function (muts) {
      muts.forEach(function (mu) {
        if (mu.type === "characterData") handle(mu.target);
        else mu.addedNodes.forEach(handle);
      });
    }).observe(document.body, { childList: true, subtree: true, characterData: true });
    scanAll();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
